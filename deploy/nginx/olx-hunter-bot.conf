# nginx site for the OLX Hunter bot webhook (host nginx, TLS by certbot).
#
#   sudo cp deploy/nginx/olx-hunter-bot.conf /etc/nginx/sites-available/olx-hunter-bot
#   # replace olxbot.example.com (2x) and 8000 (BOT_PORT in .env) below
#   sudo ln -s /etc/nginx/sites-available/olx-hunter-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d olxbot.example.com     # adds the 443/TLS block and the http→https redirect
#
# Only the Telegram webhook is forwarded; everything else gets 404, so the bot's other
# endpoints are not reachable from the internet. Requests are also authenticated by the
# X-Telegram-Bot-Api-Secret-Token header (WEBHOOK_SECRET), checked by the bot itself.

server {
    listen 80;
    listen [::]:80;
    server_name olxbot.example.com;

    # Telegram updates are small; anything big is not Telegram.
    client_max_body_size 1m;

    location = /tg/webhook {
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The bot answers immediately and processes the update in the background.
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
