# nginx site for the OLX Hunter bot webhook (host nginx, TLS cert from certbot).
#
#   # 1. get the certificate first (nginx won't load this file without it)
#   sudo certbot certonly --nginx -d olx-hunter.chugaister.net
#   # 2. install the site (if BOT_PORT in .env isn't 8000, change proxy_pass below to match)
#   sudo cp deploy/nginx/olx-hunter-bot.conf /etc/nginx/sites-available/olx-hunter-bot
#   sudo ln -s /etc/nginx/sites-available/olx-hunter-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renewal is automatic (certbot's systemd timer); check with: sudo certbot renew --dry-run
#
# Only the Telegram webhook is forwarded; everything else gets 404, so the bot's other
# endpoints are not reachable from the internet. Requests are also authenticated by the
# X-Telegram-Bot-Api-Secret-Token header (WEBHOOK_SECRET), checked by the bot itself.

server {
    listen 80;
    listen [::]:80;
    server_name olx-hunter.chugaister.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name olx-hunter.chugaister.net;

    ssl_certificate     /etc/letsencrypt/live/olx-hunter.chugaister.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olx-hunter.chugaister.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;    # created by certbot's nginx plugin
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Telegram updates are small; anything big is not Telegram.
    client_max_body_size 1m;

    location = /tg/webhook {
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The bot answers immediately and processes the update in the background.
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
